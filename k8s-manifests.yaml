# ============================================================
# USER SERVICE
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: pragalath90/mini-microservices-user_service:latest
          ports:
            - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP

---
# ============================================================
# PRODUCT SERVICE
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: pragalath90/mini-microservices-product_service:latest
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP

---
# ============================================================
# ORDER SERVICE
# (talks to user-service and product-service by their Service name -
#  Kubernetes gives every Service a DNS name automatically)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: pragalath90/mini-microservices-order_service:latest
          ports:
            - containerPort: 5003
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:5002"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP

---
# ============================================================
# API GATEWAY
# (the only service exposed outside the cluster - NodePort makes it
#  reachable at <any-node-ip>:30500)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: pragalath90/mini-microservices-api_gateway:latest
          ports:
            - containerPort: 5000
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:5002"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:5003"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort
