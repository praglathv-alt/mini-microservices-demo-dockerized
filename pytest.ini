[pytest]
testpaths = tests
# By default only the fast unit tests run.
# The end-to-end tests (marked "e2e") need the running containers,
# so GitHub Actions runs them separately with:  pytest -m e2e
addopts = -m "not e2e" -ra
markers =
    e2e: end-to-end tests that call the running API Gateway (need docker compose up)
filterwarnings =
    ignore::DeprecationWarning
