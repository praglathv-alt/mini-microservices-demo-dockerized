name: CI - Build and Test

# Runs automatically on every push / pull request to main.
# You can also start it by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# If you push again while a run is in progress, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # JOB 1: fast unit tests (no Docker needed)
  # ---------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (same as the Docker images)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q api_gateway.py user_service.py product_service.py order_service.py

      - name: Run unit tests
        run: pytest --cov=api_gateway --cov=user_service --cov=product_service --cov=order_service --cov-report=term-missing --junitxml=test-results.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-results.xml

  # ---------------------------------------------------------------
  # JOB 2: build all 4 Docker images, start them, run end-to-end tests
  # Only runs if the unit tests passed.
  # ---------------------------------------------------------------
  docker-build-and-e2e:
    name: Docker build + end-to-end tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build and start all containers
        run: docker compose up -d --build

      - name: Wait until all services are UP
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/gateway/status | grep -o '"UP"' | wc -l | grep -q '^3$'; then
              echo "All 3 backend services are UP"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "Services did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:5000
        run: pytest -m e2e -v

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
