version: "3.9"

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user_service
    container_name: user-service
    ports:
      - "5002:5002"
    networks:
      - microservices-net

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product_service
    container_name: product-service
    ports:
      - "5001:5001"
    networks:
      - microservices-net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order_service
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      # Docker's internal DNS resolves "user-service" / "product-service"
      # to the right container automatically - no IPs needed.
      USER_SERVICE_URL: "http://user-service:5002"
      PRODUCT_SERVICE_URL: "http://product-service:5001"
    depends_on:
      - user-service
      - product-service
    networks:
      - microservices-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api_gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      USER_SERVICE_URL: "http://user-service:5002"
      PRODUCT_SERVICE_URL: "http://product-service:5001"
      ORDER_SERVICE_URL: "http://order-service:5003"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
